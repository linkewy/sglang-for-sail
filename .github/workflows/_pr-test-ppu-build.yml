name: Build SAIL Wheels

on:
  workflow_call:
    inputs:
      tested_sha:
        type: string
        required: true
      build_image:
        type: string
        required: true
      validation_sha:
        type: string
        default: ''
      reuse_build_run_id:
        type: string
        default: ''
      reuse_build_manifest_sha256:
        type: string
        default: ''
    outputs:
      manifest_sha256:
        description: Manifest SHA256 of the runtime-validated shared wheel artifact
        value: ${{ jobs.runtime.outputs.manifest_sha256 }}

permissions:
  contents: read
  actions: read

jobs:
  ppu-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_sha || inputs.tested_sha }}
          persist-credentials: false
      - name: Shell and workflow contracts
        run: |
          bash -n scripts/ci/ppu/build_sail_wheels.sh
          bash -n scripts/ci/ppu/run_sail_smoke.sh
          shellcheck scripts/ci/ppu/build_sail_wheels.sh scripts/ci/ppu/run_sail_smoke.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo rhysd/actionlint:1.7.7 \
            -ignore 'label "k8s-runner-group-cpu-thead" is unknown' \
            .github/workflows/pr-test-ppu.yml .github/workflows/_pr-test-ppu-build.yml .github/workflows/_pr-test-ppu-smoke.yml

  build:
    needs: ppu-lint
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ${{ inputs.build_image }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    env:
      # The image's default index lacks build; provider/hash checks still apply.
      PIP_INDEX_URL: https://pypi.org/simple
      SAIL_TESTED_SHA: ${{ inputs.tested_sha }}
      SAIL_BUILD_IMAGE: ${{ inputs.build_image }}
      SGL_KERNEL_COMPILE_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      # Trust only this job's bind-mounted checkout, without changing global config.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Build runner resources
        id: resources
        run: |
          uname -m
          nproc
          free -h
          df -h / /tmp
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_sha || inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CPU unit and import checks
        run: |
          python3 scripts/ci/ppu/prepare_sail_env.py tools --venv "$RUNNER_TEMP/ppu-checks"
          "$RUNNER_TEMP/ppu-checks/bin/python3" -m unittest discover -s scripts/ci/ppu -p 'test_*.py'
          "$RUNNER_TEMP/ppu-checks/bin/python3" -m compileall -q scripts/ci/ppu test/registered/ppu
          PYTHONPATH=python "$RUNNER_TEMP/ppu-checks/bin/python3" test/registered/unit/test_sail_dispatch.py -v
          PYTHONPATH=python "$RUNNER_TEMP/ppu-checks/bin/python3" test/registered/unit/multimodal/test_internvl_utils_import.py TestInternVLDependency -v
      - name: Prepare Rust 1.92.0
        if: inputs.reuse_build_run_id == ''
        uses: dtolnay/rust-toolchain@0be0c8e6607124ba7557736a4b6b5a8fe2b0c284
      - name: Compile and validate two wheels without runtime dependencies
        if: inputs.reuse_build_run_id == ''
        run: bash scripts/ci/ppu/build_sail_wheels.sh "$RUNNER_TEMP/wheel-python3.12-sail"
      - id: reuse
        if: inputs.reuse_build_run_id != ''
        uses: actions/github-script@v7
        env:
          REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
        with:
          script: |
            const run_id = Number(process.env.REUSE_BUILD_RUN_ID);
            if (context.eventName !== 'workflow_dispatch' || !Number.isSafeInteger(run_id) || run_id <= 0) {
              throw new Error('Artifact reuse is restricted to explicit manual runs');
            }
            const args = {...context.repo, run_id, per_page: 100};
            const {data: run} = await github.rest.actions.getWorkflowRun(args);
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.status !== 'completed' || run.head_sha !== process.env.SAIL_TESTED_SHA ||
                run.path !== '.github/workflows/pr-test-ppu.yml' ||
                run.repository.full_name !== repository || run.head_repository.full_name !== repository) {
              throw new Error('Source build run identity mismatch');
            }
            const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun(args);
            const built = jobs.filter(job => job.name === 'ppu-wheel-build / build' &&
              job.conclusion === 'success' && job.steps.some(step =>
                step.name === 'Compile and validate two wheels without runtime dependencies' && step.conclusion === 'success'));
            if (built.length !== 1) throw new Error('A successful original compilation is required');
            const {data: {artifacts}} = await github.rest.actions.listWorkflowRunArtifacts(args);
            const selected = artifacts.filter(a => a.name === 'wheel-python3.12-sail-build' && !a.expired);
            if (selected.length !== 1) throw new Error('Exactly one unexpired build artifact is required');
            core.setOutput('artifact_id', selected[0].id);
            console.log(`Reusing build run ${run_id}, artifact ${selected[0].id}, source SHA ${run.head_sha}`);
      - id: reuse_download
        if: inputs.reuse_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: wheel-python3.12-sail-build
          run-id: ${{ inputs.reuse_build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wheel-python3.12-sail/
      - id: manifest
        env:
          REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
          REUSE_BUILD_MANIFEST_SHA256: ${{ inputs.reuse_build_manifest_sha256 }}
        run: |
          if [[ -n "$REUSE_BUILD_RUN_ID" ]]; then
            [[ "$REUSE_BUILD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "$REUSE_BUILD_MANIFEST_SHA256" "$RUNNER_TEMP/wheel-python3.12-sail/manifest.json" | sha256sum --check --strict
          fi
          python3 scripts/ci/ppu/sail_wheel_manifest.py verify "$RUNNER_TEMP/wheel-python3.12-sail" --stage build \
            --expected-sha "$SAIL_TESTED_SHA" --build-image "$SAIL_BUILD_IMAGE"
          digest=$(sha256sum "$RUNNER_TEMP/wheel-python3.12-sail/manifest.json")
          echo "manifest_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python3.12-sail-build
          path: ${{ runner.temp }}/wheel-python3.12-sail/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  runtime:
    needs: build
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ${{ inputs.build_image }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      SAIL_TESTED_SHA: ${{ inputs.tested_sha }}
      SAIL_BUILD_IMAGE: ${{ inputs.build_image }}
      SAIL_BUILD_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      SAIL_VALIDATION_SHA: ${{ inputs.validation_sha || inputs.tested_sha }}
      SAIL_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id || github.run_id }}
      SAIL_ALLOW_IMAGE_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_sha || inputs.tested_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheel-python3.12-sail-build
          path: ${{ runner.temp }}/wheel-python3.12-sail/
      - name: Resolve and validate the runtime without rebuilding wheels
        run: |
          python3 scripts/ci/ppu/prepare_sail_env.py resolve \
            --venv "$RUNNER_TEMP/ppu-runtime" --artifact "$RUNNER_TEMP/wheel-python3.12-sail"
      - id: manifest
        run: |
          python3 scripts/ci/ppu/sail_wheel_manifest.py verify "$RUNNER_TEMP/wheel-python3.12-sail" \
            --expected-sha "$SAIL_TESTED_SHA" --build-image "$SAIL_BUILD_IMAGE"
          digest=$(sha256sum "$RUNNER_TEMP/wheel-python3.12-sail/manifest.json")
          echo "manifest_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python3.12-sail
          path: ${{ runner.temp }}/wheel-python3.12-sail/
          retention-days: 3
          if-no-files-found: error
          overwrite: true
