name: PR Test (PPU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test; leave empty to use the triggering commit
        type: string
        default: ''
      reuse_build_run_id:
        description: Optional original build run ID; requires ref as its full SHA and a manifest hash
        type: string
        default: ''
      reuse_build_manifest_sha256:
        description: Verified original build manifest SHA256 for manual artifact reuse
        type: string
        default: ''
      run_all_tests:
        description: Ignore path filters and run smoke tests on both board types
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      run_all_tests:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: >-
    pr-test-ppu-${{
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name != 'run-ci' && github.event.label.name != 'run-ci-ppu') &&
      format('ignored-label-{0}', github.run_id) || inputs.ref || github.ref
    }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: >-
      ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
           github.event.label.name != 'run-ci' && github.event.label.name != 'run-ci-ppu') &&
          'ignored-label-check-changes' || 'check-changes' }}
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'labeled' ||
      github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-ppu'
    runs-on: ubuntu-latest
    outputs:
      ppu: ${{ steps.filter.outputs.ppu == 'true' || inputs.run_all_tests == true || inputs.reuse_build_run_id != '' }}
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
      validation_sha: ${{ steps.identity.outputs.validation_sha }}
      build_image: ${{ steps.identity.outputs.build_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' || inputs.reuse_build_run_id != '') && github.sha || inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          TESTED_REF: ${{ inputs.ref }}
          REUSE_BUILD_RUN_ID: ${{ inputs.reuse_build_run_id }}
          REUSE_BUILD_MANIFEST_SHA256: ${{ inputs.reuse_build_manifest_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          validation = git('rev-parse', 'HEAD')
          tested = validation
          run_id = os.environ['REUSE_BUILD_RUN_ID']
          digest = os.environ['REUSE_BUILD_MANIFEST_SHA256']
          if run_id:
              if (os.environ['EVENT_NAME'] != 'workflow_dispatch'
                      or not re.fullmatch(r'[1-9][0-9]*', run_id)
                      or not re.fullmatch(r'[0-9a-f]{64}', digest)
                      or not re.fullmatch(r'[0-9a-f]{40}', os.environ['TESTED_REF'])):
                  raise SystemExit('Reuse requires a manual run, full source SHA, run ID and manifest hash')
              tested = git('rev-parse', '--verify', os.environ['TESTED_REF'] + '^{commit}')
              allowed = {
                  '.github/workflows/pr-test-ppu.yml',
                  '.github/workflows/_pr-test-ppu-build.yml',
                  '.github/workflows/_pr-test-ppu-smoke.yml',
                  'scripts/ci/ppu/prepare_sail_env.py',
                  'scripts/ci/ppu/run_sail_smoke.sh',
                  'scripts/ci/ppu/test_prepare_sail_env.py',
                  'scripts/ci/ppu/test_ppu_ci_contract.py',
                  'docs/docs/hardware-platforms/sail.mdx',
              }
              changed = set(git('diff', '--name-only', tested, validation).splitlines())
              if changed - allowed:
                  raise SystemExit('Source/build/test changes require recompilation: ' + ', '.join(sorted(changed - allowed)))
          elif digest:
              raise SystemExit('A reuse manifest hash requires a source run ID')
          print(f'Wheel source SHA: {tested}; validation SHA: {validation}; source build run: {run_id or "current"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tested_sha={tested}\nvalidation_sha={validation}\n')
          PY
          echo 'build_image=download.t-head.cn/docker_release/pytorch@sha256:a33a67832f7ec442c481421e94255518dd67e464406f8e610c15d2b594b21f80' >> "$GITHUB_OUTPUT"
      - id: filter
        if: inputs.run_all_tests != true && inputs.reuse_build_run_id == ''
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ppu:
              - '.github/workflows/pr-test-ppu.yml'
              - '.github/workflows/_pr-test-ppu-*.yml'
              - '.github/workflows/pr-gate.yml'
              - 'python/**'
              - 'rust/**'
              - 'scripts/release/**'
              - 'scripts/ci/ppu/**'
              - 'test/run_suite.py'
              - 'test/registered/ppu/**'
              - 'test/registered/unit/test_sail_dispatch.py'
              - 'test/registered/unit/multimodal/test_internvl_utils_import.py'
              - 'CMakeLists.txt'
              - 'pyproject.toml'
              - 'setup.cfg'
              - 'MANIFEST.in'
              - 'README.md'
              - 'LICENSE'
              - 'docs/docs/hardware-platforms/sail.mdx'

  pr-gate:
    needs: check-changes
    if: needs.check-changes.outputs.ppu == 'true'
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-run-ci: true
      require-label: run-ci-ppu

  ppu-wheel-build:
    needs: [check-changes, pr-gate]
    if: needs.check-changes.outputs.ppu == 'true' && needs.pr-gate.result == 'success'
    uses: ./.github/workflows/_pr-test-ppu-build.yml
    with:
      tested_sha: ${{ needs.check-changes.outputs.tested_sha }}
      validation_sha: ${{ needs.check-changes.outputs.validation_sha }}
      build_image: ${{ needs.check-changes.outputs.build_image }}
      reuse_build_run_id: ${{ inputs.reuse_build_run_id || '' }}
      reuse_build_manifest_sha256: ${{ inputs.reuse_build_manifest_sha256 || '' }}

  ppu-smoke:
    needs: [check-changes, ppu-wheel-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - board_selector: board-type=OAM-810E
            expected_device_name: ZW810E
          - board_selector: board-type=ZW-M890P
            expected_device_name: ZW-M890P
    uses: ./.github/workflows/_pr-test-ppu-smoke.yml
    with:
      tested_sha: ${{ needs.check-changes.outputs.tested_sha }}
      validation_sha: ${{ needs.check-changes.outputs.validation_sha }}
      build_image: ${{ needs.check-changes.outputs.build_image }}
      manifest_sha256: ${{ needs.ppu-wheel-build.outputs.manifest_sha256 }}
      board_selector: ${{ matrix.board_selector }}
      expected_device_name: ${{ matrix.expected_device_name }}

  pr-test-ppu-finish:
    name: >-
      ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
           github.event.label.name != 'run-ci' && github.event.label.name != 'run-ci-ppu') &&
          'ignored-label-pr-test-ppu-finish' || 'pr-test-ppu-finish' }}
    needs: [check-changes, pr-gate, ppu-wheel-build, ppu-smoke]
    if: always() && needs.check-changes.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - id: statuses
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          check = needs['check-changes']
          if check['result'] != 'success':
              raise SystemExit('Change detection failed')
          scope = check['outputs'].get('ppu')
          if scope not in ('true', 'false'):
              raise SystemExit('Missing scope decision')
          expected = 'success' if scope == 'true' else 'skipped'
          for job in ('pr-gate', 'ppu-wheel-build', 'ppu-smoke'):
              if needs[job]['result'] != expected:
                  raise SystemExit(f'{job}: expected {expected}, got {needs[job]["result"]}')
          PY
      - uses: actions/download-artifact@v4
        if: needs.check-changes.outputs.ppu == 'true'
        with:
          pattern: ppu-smoke-*-${{ github.run_attempt }}-receipt
          path: ppu-receipts
          merge-multiple: true
      - id: receipts
        if: needs.check-changes.outputs.ppu == 'true'
        env:
          TESTED_SHA: ${{ needs.check-changes.outputs.tested_sha }}
          BUILD_IMAGE: ${{ needs.check-changes.outputs.build_image }}
          MANIFEST_SHA256: ${{ needs.ppu-wheel-build.outputs.manifest_sha256 }}
          RECEIPT_ROOT: ppu-receipts
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RECEIPT_ROOT'])
          boards = {'ZW810E', 'ZW-M890P'}
          if not root.is_dir() or {p.name for p in root.iterdir()} != {b + '.json' for b in boards}:
              raise SystemExit('Both board receipts from this attempt are required')
          for board in boards:
              receipt = json.loads((root / (board + '.json')).read_text())
              expected = dict(git_sha=os.environ['TESTED_SHA'], build_image=os.environ['BUILD_IMAGE'],
                              manifest_sha256=os.environ['MANIFEST_SHA256'], expected_device=board)
              if any(receipt.get(k) != v for k, v in expected.items()):
                  raise SystemExit('Board receipt identity mismatch')
          PY
